:12.071Z\",\"updatedAt\":\"2024-12-16T14:15:12.071Z\",\"publishedAt\":\"2024-12-16T14:15:12.068Z\",\"featuredAt\":null,\"approvedAt\":null,\"type\":\"site\",\"attributes\":{\"url\":\"https://contra.com/\",\"categories\":[{\"id\":\"1fec15c2-ca4a-4d52-bf3a-c04e6d002202\",\"name\":\"SaaS\",\"slug\":\"saas\"},{\"id\":\"d26c907e-7d56-4582-9727-b7c10921b71e\",\"name\":\"Community\",\"slug\":\"community\"}]}},{\"id\":\"79\",\"resolved\":true,\"title\":\"Loops\",\"body\":null,\"bodyJson\":null,\"introduction\":\"Re-design and Development of Loops.so home page, mega menu navigation, and template pages. \",\"slug\":\"loops\",\"author\":{\"framerUserId\":\"f609bf1b-a93b-49be-9d70-43169680e4a8\",\"name\":\"Adriano Reis\",\"slug\":\"adrianoreis\",\"avatar\":\"https://y4pdgnepgswqffpt.public.blob.vercel-storage.com/creators/38026/0be83efc57823132d40c7c5c96ffa3c2-0CBrG7AlRLKWwwnPaQKyhD7alN89ik\",\"badges\":[\"available\",\"pro\",\"expert\"],\"followed\":false,\"followsYou\":false},\"media\":[{\"type\":\"image\",\"url\":\"https://y4pdgnepgswqffpt.public.blob.vercel-storage.com/sites/79/thumbnail-RSj7ewQW8yYCwyhrTVpzrsaslALWc5.jpg\"}],\"post\":{\"id\":\"0193cfd2-b0c5-7464-9f3c-8cd6d6e877a3\",\"bodyJson\":null,\"likes\":{\"count\":0,\"liked\":false},\"comments\":{\"count\":0},\"reposts\":{\"count\":0,\"reposted\":false,\"repostId\":null}},\"createdAt\":\"2024-12-16T14:15:11.817Z\",\"updatedAt\":\"2025-08-02T16:08:25.229Z\",\"publishedAt\":\"2024-12-16T14:15:11.813Z\",\"featuredAt\":null,\"approvedAt\":null,\"type\":\"site\",\"attributes\":{\"url\":\"https://loops.so/\",\"categories\":[{\"id\":\"1fec15c2-ca4a-4d52-bf3a-c04e6d002202\",\"name\":\"SaaS\",\"slug\":\"saas\"},{\"id\":\"ddd39099-5b17-42e0-b333-7b7c480a114f\",\"name\":\"Business\",\"slug\":\"business\"}]}}]}]}]]}]\n68:T5dd,\u003ch3\u003eTurning AI agents into a real GTM team\u003c/h3\u003e\u003cp\u003eCluster gives AI agents the infrastructure they need to run outbound campaigns — from finding and qualifying leads to researching accounts, writing sequences, and reaching prospects through email and LinkedIn. It connects agents to 50+ data sources and lets teams run hundreds of agents in parallel.\u003c/p\u003e\u003ch3\u003eThe Challenge\u003c/h3\u003e\u003cp\u003eThe idea behind Cluster is pretty powerful, but a lot is going on.\u003c/p\u003e\u003cp\u003eLead databases, buying signals, enrichment, AI agents, LinkedIn, email, CRM data, sequences — all of these pieces could easily make the product feel complicated.\u003c/p\u003e\u003cp\u003eThe website needed to make one thing clear:\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eCluster isn\u0026#39;t just helping you find leads. It\u0026#39;s giving your AI agents the tools to actually run your GTM.\u003c/strong\u003e\u003c/p\u003e\u003ch3\u003eThe Design\u003c/h3\u003e\u003cp\u003eI wanted the product to do most of the explaining.\u003c/p\u003e\u003cp\u003eInstead of relying on generic AI visuals, the website shows agents researching accounts, finding buying signals, qualifying prospects, drafting outreach, and moving leads through the funnel.\u003c/p\u003e\u003cp\u003eThis makes the idea much easier to understand because you can actually see what the agents are doing.\u003c/p\u003e\u003ch3\u003eThe Result\u003c/h3\u003e\u003cp\u003eThe final direction makes a fairly technical GTM product feel much easier to understand.\u003c/p\u003e\u003cp\u003eInstead of leading with integrations and features, the website shows the work happening in front of you.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eGive your agents the data, tools, and context to build pipeline.\u003c/strong\u003e\u003c/p\u003e69:T68e,\u003ch3\u003eMaking an AI eCommerce product easy to understand\u003c/h3\u003e\u003cp\u003eLookfor is an AI platform for eCommerce brands, helping businesses handle customer conversations, sales, and support across different channels.\u003c/p\u003e\u003cp\u003eThe challenge was to present all of that without making the website feel like a long list of AI features.\u003c/p\u003e\u003ch3\u003eThe Challenge\u003c/h3\u003e\u003cp\u003eThere’s quite a lot happening inside Lookfor.\u003c/p\u003e\u003cp\u003eIt can help with customer support, product discovery, sales conversations, and automation. The website needed to explain these different use cases while keeping the main message simple.\u003c/p\u003e\u003cp\u003eThe goal was to make someone understand the product within the first few sections instead of having to read through everything.\u003c/p\u003e\u003ch3\u003eThe Design\u003c/h3\u003e\u003cp\u003eI kept the visual direction clean and product-focused.\u003c/p\u003e\u003cp\u003eInstead of relying on illustrations to explain what Lookfor does, I used the product interface and real-looking interactions wherever possible.\u003c/p\u003e\u003cp\u003eThe different use cases are separated into clear sections, so the visitor can quickly understand how Lookfor fits into an eCommerce business.\u003c/p\u003e\u003ch3\u003eShowing Instead of Telling\u003c/h3\u003e\u003cp\u003eA big part of the design was showing the product in action.\u003c/p\u003e\u003cp\u003eAI can be difficult to explain with just words, especially when the product is handling conversations and making decisions. Showing the interface and the actual experience makes the value much easier to understand.\u003c/p\u003e\u003ch3\u003eThe Result\u003c/h3\u003e\u003cp\u003eThe final website makes a fairly complex AI product feel more straightforward and approachable.\u003c/p\u003e\u003cp\u003eThe focus stays on what matters: \u003cstrong\u003ewhat Lookfor does, how it works, and what it can do for an eCommerce business.\u003c/strong\u003e\u003c/p\u003e6a:T99a,\u003ch3\u003e\u003cstrong\u003eLookfor AI — AI-Powered eCommerce SaaS Platform\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eLookfor AI is a modern AI-powered SaaS platform built for eCommerce businesses, enabling brands to deliver intelligent customer support and personalized shopping experiences through AI. The website was designed to present a feature-rich product with a clean, scalable interface that balances technical depth with an intuitive user experience. I developed a complete six-page Framer website that showcases the platform\u0026#39;s capabilities while maintaining a premium SaaS aesthetic focused on clarity, trust, and conversions.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eServices Provided\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003eFramer Development\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eComplete 6-Page Website\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eSaaS Website Development\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eResponsive Development\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCustom Animations\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePerformance Optimization\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003eProject Highlights\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003eDeveloped a complete six-page SaaS website with a consistent design system and user experience.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBuilt modern product pages that effectively communicate AI-powered eCommerce solutions and platform features.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eImplemented smooth custom animations and micro-interactions to enhance engagement.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCreated a fully responsive experience optimized for desktop, tablet, and mobile devices.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eStructured the website to simplify complex product information and improve user journeys.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eOptimized the site for fast performance, scalability, and conversion-focused interactions.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003ch2\u003e\u003cstrong\u003eLet\u0026#39;s Build Your SaaS Website\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003eWhether you\u0026#39;re launching an AI startup, SaaS platform, or digital product, I build premium Framer websites that combine modern design, seamless interactions, and high-converting user experiences.\u003c/p\u003e\u003cp\u003e\u003cspan data-type=\"emoji\" data-name=\"calling\"\u003e📲\u003c/span\u003e\u003cstrong\u003e WhatsApp:\u003c/strong\u003e \u003ca href=\"https://wa.me/923260558191?text=Hi%20Mazher!%20I%20just%20viewed%20your%20Lookfor%20AI%20project.%20I\u0026#39;m%20interested%20in%20building%20a%20premium%20SaaS%20website%20for%20my%20business.%20Can%20we%20discuss%20my%20project%3F\" rel=\"noopener noreferrer nofollow\" target=\"_blank\"\u003ehttps://wa.me/923260558191?text=Hi%20Mazher!%20I%20just%20viewed%20your%20Lookfor%20AI%20project.%20I\u0026#39;m%20interested%20in%20building%20a%20premium%20SaaS%20website%20for%20my%20business.%20Can%20we%20discuss%20my%20project%3F\u003c/a\u003e\u003c/p\u003e66:[\"$\",\"section\",null,{\"className\":\"related-row-layout-module-scss-module__zpYm4G__root\",\"children\":[[\"$\",\"div\",null,{\"className\":\"related-row-layout-module-scss-module__zpYm4G__separator\",\"data-recommendation-separator\":true,\"aria-hidden\":\"true\"}],[\"$\",\"div\",null,{\"className\":\"related-row-layout-module-scss-module__zpYm4G__header\",\"children\":[\"$\",\"h2\",null,{\"className\":\"related-row-layout-module-scss-module__zpYm4G__title\",\"children\":\"Related Sites\"}]}],[\"$\",\"div\",null,{\"className\":\"related-row-layout-module-scss-module__zpYm4G__grid\",\"children\":[\"$\",\"$L67\",null,{\"items\":[{\"id\":\"17090\",\"resolved\":true,\"title\":\"Cluster Ai\",\"body\":\"$68\",\"bodyJson\":{\"type\":\"doc\",\"content\":[{\"type\":\"customHeading\",\"content\":[{\"type\":\"text\",\"text\":\"Turning AI agents into a real GTM team\"}],\"attrs\":{\"level\":2}},{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"Cluster gives AI agents the infrastructure they rstand.\"}]},{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"Instead of leading with integrations and features, the website shows the work happening in front of you.\"}]},{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"Give your agents the data, tools, and context to build pipeline.\",\"marks\":[{\"type\":\"bold\"}]}]}]},\"introduction\":\"\",\"slug\":\"cluster-ai\",\"author\":{\"framerUserId\":\"ba95b34a-5ed3-496b-b8b2-e8c0a7412fcb\",\"name\":\"Krokzy\",\"slug\":\"krokzy\",\"avatar\":\"https://y4pdgnepgswqffpt.public.blob.vercel-storage.com/creators/2057450/_LOuTwfoj-wwUSciBlcKRdMrpgbBhdqkjnCk5hnd\",\"badges\":[\"available\",\"studio\"],\"followed\":false,\"followsYou\":false},\"media\":[{\"type\":\"image\",\"url\":\"https://y4pdgnepgswqffpt.public.blob.vercel-storage.com/media/ba95b34a-5ed3-496b-b8b2-e8c0a7412fcb/01a03dda-16c8-76fb-b8a8-3a731f4d9a77.jpg\"}],\"post\":{\"id\":\"01a03dda-2664-7288-afeb-82ad4a03e2c3\",\"bodyJson\":null,\"likes\":{\"count\":1,\"liked\":false},\"comments\":{\"count\":0},\"reposts\":{\"count\":0,\"reposted\":false,\"repostId\":null}},\"createdAt\":\"2026-08-26T11:35:01.390Z\",\"updatedAt\":\"2026-08-26T11:35:01.390Z\",\"publishedAt\":\"2026-08-26T11:35:01.386Z\",\"featuredAt\":null,\"approvedAt\":null,\"type\":\"site\",\"attributes\":{\"url\":\"https://www.getcluster.ai/\",\"categories\":[{\"id\":\"0539c25a-136d-4f8b-a2e7-342a21b7d607\",\"name\":\"AI\",\"slug\":\"ai\"},{\"id\":\"1fec15c2-ca4a-4d52-bf3a-c04e6d002202\",\"name\":\"SaaS\",\"slug\":\"saas\"},{\"id\":\"b65821c4-e205-4861-a28b-1623536037f7\",\"name\":\"Landing Page\",\"slug\":\"landing-page\"}]}},{\"id\":\"17068\",\"resolved\":true,\"title\":\"Lookfor Agentic\",\"body\":\"$69\",\"bodyJson\":{\"type\":\"doc\",\"content\":[{\"type\":\"customHeading\",\"content\":[{\"type\":\"text\",\"text\":\"Making an AI eCommerce product easy to understand\"}],\"attrs\":{\"level\":2}},{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"Lookfor is an AI platform for eCommerce brands, helping businesses handle customer conversations, sales, and support across different channels.\"}]},{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"The challenge was to present all of that without making the website feel like a long list of AI features.\"}]},{\"type\":\"customHeading\",\"content\":[{\"type\":\"text\",\"text\":\"The Challenge\"}],\"attrs\":{\"level\":2}},{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"There’s quite a lot happening inside Lookfor.\"}]},{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"It can help with customer support, product discovery, sales conversations, and automation. The website needed to explain these different use cases while keeping the main message simple.\"}]},{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"The goal was to make someone understand the product within the first few sections instead of having to read through everything.\"}]},{\"type\":\"customHeading\",\"content\":[{\"type\":\"text\",\"text\":\"The Design\"}],\"attrs\":{\"level\":2}},{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"I kept the visual direction clean and product-focused.\"}]},{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"Instead of relying on illustrations to explain what Lookfor does, I used the product interface and real-looking interactions wherever possible.\"}]},{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"The different use cases are separated into clear sections, so the visitor can quickly understand how Lookfor fits into an eCommerce business.\"}]},{\"type\":\"customHeading\",\"content\":[{\"type\":\"text\",\"text\":\"Showing Instead of Telling\"}],\"attrs\":{\"level\":2}},{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"A big part of the design was showing the product in action.\"}]},{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"AI can be difficult to explain with just words, especially when the product is handling conversations and making decisions. Showing the interface and the actual experience makes the value much easier to understand.\"}]},{\"type\":\"customHeading\",\"content\":[{\"type\":\"text\",\"text\":\"The Result\"}],\"attrs\":{\"level\":2}},{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"The final website makes a fairly complex AI product feel more straightforward and approachable.\"}]},{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"The focus stays on what matters: \"},{\"type\":\"text\",\"text\":\"what Lookfor does, how it works, and what it can do for an eCommerce business.\",\"marks\":[{\"type\":\"bold\"}]}]}]},\"introduction\":\"\",\"slug\":\"lookfor-agentic\",\"author\":{\"framerUserId\":\"ba95b34a-5ed3-496b-b8b2-e8c0a7412fcb\",\"name\":\"Krokzy\",\"slug\":\"krokzy\",\"avatar\":\"https://y4pdgnepgswqffpt.public.blob.vercel-storage.com/creators/2057450/_LOuTwfoj-wwUSciBlcKRdMrpgbBhdqkjnCk5hnd\",\"badges\":[\"available\",\"studio\"],\"followed\":false,\"followsYou\":false},\"media\":[{\"type\":\"image\",\"url\":\"https://y4pdgnepgswqffpt.public.blob.vercel-storage.com/media/ba95b34a-5ed3-496b-b8b2-e8c0a7412fcb/01a0388f-de9b-745f-8218-7b0e524479f1.jpg\"}],\"post\":{\"id\":\"01a03890-4148-77bc-8fa7-ae2450834f4d\",\"bodyJson\":null,\"likes\":{\"count\":1,\"liked\":false},\"comments\":{\"count\":0},\"reposts\":{\"count\":0,\"reposted\":false,\"repostId\":null}},\"createdAt\":\"2026-08-25T10:56:12.548Z\",\"updatedAt\":\"2026-08-25T10:56:12.548Z\",\"publishedAt\":\"2026-08-25T10:56:12.540Z\",\"featuredAt\":null,\"approvedAt\":null,\"type\":\"site\",\"attributes\":{\"url\":\"https://dub.sh/lookfor/\",\"categories\":[{\"id\":\"0539c25a-136d-4f8b-a2e7-342a21b7d607\",\"name\":\"AI\",\"slug\":\"ai\"},{\"id\":\"1fec15c2-ca4a-4d52-bf3a-c04e6d002202\",\"name\":\"SaaS\",\"slug\":\"saas\"},{\"id\":\"b65821c4-e205-4861-a28b-1623536037f7\",\"name\":
