 a business process automation tool.\"}]},{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"The template uses a modern product aesthetic with a four-part engine section, an infrastructure feature block, five use case cards, stat counters, an integrations section, three-tier pricing, a six-question FAQ, and a CMS articles blog.\"}]},{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"What is Included\"}]},{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"Home, About, Articles, Contact, and legal pages. The homepage includes a hero with a product screenshot, a logo bar, an AI engine section, an infrastructure block, use case cards, stat counters, integrations, pricing, FAQ, and a closing CTA. CMS collections cover Articles and Legal pages, both with detail pages manageable without code.\"}]},{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"Key Features\"}]},{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"The AI engine section covers workflow automation, integrations for CRMs and APIs, data processing, and a decision engine that triggers next actions. The infrastructure block covers high availability with multi-region failover, low-latency execution, edge delivery, a scalable workflow engine, and fault tolerance. Five use case cards cover lead qualification, ticket routing, campaign automation, data sync, and invoice processing. Three pricing tiers cover workflow limits, integrations, monitoring, and enterprise security with SSO.\"}]},{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"Who This Is For\"}]},{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"Suited to workflow automation founders, integration platform teams, operations SaaS startups, AI decision engine products, and business process tools targeting sales, support, and operations teams.\"}]},{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"Template Details\"}]},{\"type\":\
