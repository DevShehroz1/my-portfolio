 iframe. That works until you need real design control.\u003c/p\u003e\u003cp\u003eWith an iframe you cannot restyle controls like Framer layers. You cannot place only the play button. You cannot put the timeline under the player or float controls anywhere in the layout. The embed decides the UI.\u003c/p\u003e\u003cp\u003eStream Bunny breaks that pattern. Drop components. Skin them in Framer. Ship a layout that looks like your site, not a stock widget.\u003c/p\u003e\u003ch3\u003eWhat you can build\u003c/h3\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eAdaptive HLS playback\u003c/strong\u003e from your Bunny Stream library (quality adapts to the network)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eVideo Player\u003c/strong\u003e with Library ID, Video ID, and CDN host on the property panel\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eControls\u003c/strong\u003e as separate layers: play/pause, seekable progress, time display, volume, fullscreen\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eShared player state\u003c/strong\u003e across every control on the page\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eTemplates\u003c/strong\u003e for pre-composed player layouts (one free starter today; more rolling out over time)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eQuality Picker (Pro)\u003c/strong\u003e for manual rendition switching when you need it\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eEverything is layout-native: spacing, color, radius, typography, and position work like any other Framer component.\u003c/p\u003e\u003ch3\u003eComponents\u003c/h3\u003e\u003cp\u003e\u003cstrong\u003eFree tier (6 components)\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003eBunnyVideoPlayer (HLS · adaptive quality)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBunnyPlayPauseButton\u003c ition switching when you need it\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eEverything is layout-native: spacing, color, radius, typography, and position work like any other Framer component.\u003c/p\u003e\u003ch3\u003eComponents\u003c/h3\u003e\u003cp\u003e\u003cstrong\u003eFree tier (6 components)\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003eBunnyVideoPlayer (HLS · adaptive quality)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBunnyPlayPauseButton\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBunnyProgressBar (seekable)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBunnyTimeDisplay\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBunnyVolumeSlider\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBunnyFullscreenButton\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003ePro\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003eBunnyQualityPickerButton (renditions · adaptive)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eIdle Fade code override (fade layer after pointer idle)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eAdditional templates as they ship\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003eComing soon\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003eCaptions\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eChapter markers\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003eTemplates\u003c/h3\u003e\u003cp\u003ePre-composed player layouts you can drop in one step instead of wiring every control by hand.\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eFree:\u003c/strong\u003e one starter template (full-width hero-style layout).\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003ePro:\u003c/strong\u003e additional templates as they ship (portfolio reels, grids, tutorials, and similar layouts).\u003c/p\u003e\u003c/li\u0 js\",\"/creators-assets/_next/static/immutable/chunks/2mf7pfutw76ll.js\"],\"RelatedRowItems\"]\n66:null\n69:T852,\u003cp\u003e↻ Recurring revenue, set and forget. Sell subscriptions in Framer without a single line of code.\u003c/p\u003e\u003cp\u003eSubscription Payments adds a drop-in Subscribe button to any Framer page. Paste your Razorpay or Stripe API key, paste your subscription link, drop the component on the canvas. Customers subscribe in seconds — billing happens on autopilot.\u003c/p\u003e\u003cp\u003e✨ WHAT YOU GET\u003c/p\u003e\u003cp\u003e• A fully customizable Subscribe button — color, text, radius, billing note, behavior\u003c/p\u003e\u003cp\u003e• Real-time live preview as you tweak\u003c/p\u003e\u003cp\u003e• Razorpay AND Stripe in one plugin — auto-detects from your API key\u003c/p\u003e\u003cp\u003e• Cancel-anytime UX built in (boosts conversion, reduces commitment friction)\u003c/p\u003e\u003cp\u003e• Works for SaaS, memberships, courses, subscription boxes, donations — anything recurring\u003c/p\u003e\u003cp\u003e⚡ HOW IT WORKS\u003c/p\u003e\u003cp\u003e1. Create a subscription plan in your Razorpay or Stripe dashboard (monthly, yearly, with or without trial)\u003c/p\u003e\u003cp\u003e2. Paste your API key (rzp_test_ / pk_test_ to start)\u003c/p\u003e\u003cp\u003e3. Paste your recurring subscription link\u003c/p\u003e\u003cp\u003e4. Style the button to match your brand\u003c/p\u003e\u003cp\u003e5. Insert the component, drop on canvas, publish\u003c/p\u003e\u003cp\u003e🌍 BUILT FOR ANY MARKET\u003c/p\u003e\u003cp\u003e• 🇮🇳 Razorpay — UPI, cards, netbanking, perfect for India\u003c/p\u003e\u003cp\u003e• 🌐 Stripe — cards, Apple Pay, Google Pay, Link, 46+ countries\u003c/p\u003e\u003cp\u003e• Selling globally? Use both. One plugin, zero extra integration work.\u003c/p\u003e\u003cp\u003e🚀 FREE vs PRO\u003c/p\u003e\u003cp\u003e• Free — fully functional with test keys (rzp_test_ / pk_test_). Build, demo, prototype.\u003c/p\u003e\u003cp\u003e• Pro ($29 one-time) — unlock live keys for real recurring revenue. No subscription. Lifetime updates.\u003c/p\u003e\u003cp\u003e🎯 WHY THIS PLUGIN\u003c/p\u003e\u003cp\u003e• No backend, no servers, no payment API code to write\u003c/p\u003e\u003cp\u003e• Razorpay/Stripe handle the recurring charges — your customers are billed every cycle automatically\u003c/p\u003e\u003cp\u003e• You own the platform account, you own the money — we never touch your funds\u003c/p\u003e\u003cp\u003e• 30-day money-back guarantee on Pro\u003c/p\u003e\u003cp\u003e• Built by KDX Studios\u003c/p\u003e\u003cp\u003eQuestions? 📩 \u003ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"mailto:hardik@mynuora.com\"\u003ethekhushaldewra@gmail.com\u003c/a\u003e\u003c/p\u003e6a:T7b1,\u003cp\u003e🧮 5 calculator presets for Framer. One drop-in component, live results.\u003c/p\u003e\u003cp\u003ePick a preset, tweak the labels and colors, drop the calculator on any Framer page. Result updates live as visitors type — no calculate button, no reload, no backend.\u003c/p\u003e\u003cp\u003e✨ WHAT YOU GET\u003c/p\u003e\u003cp\u003e• 5 built-in presets: Loan EMI, BMI, ROI %, Project Pricing, Savings Goal\u003c/p\u003e\u003cp\u003e• Editable title, result label, prefix, suffix\u003c/p\u003e\u003cp\u003e• Brand colors: primary, text, background\u003c/p\u003e\u003cp\u003e• Live result with every keystroke\u003c/p\u003e\u003cp\u003e• Mobile-ready, no CSS to write\u003c/p\u003e\u003cp\u003e• Hidden footer on Pro, branded footer on Free\u003c/p\u003e\u003cp\u003e⚡ HOW IT WORKS\u003c/p\u003e\u003cp\u003e1. Open the Calculator plugin in Framer\u003c/p\u003e\u003cp\u003e2. Pick a preset (Loan EMI, BMI, ROI, Pricing, Savings)\u003c/p\u003e\u003cp\u003e3. Customize the title, labels, colors\u003c/p\u003e\u003cp\u003e4. Click \"Insert Calculator\" — the component lands in Assets → Code Components\u003c/p\u003e\u003cp\u003e5. Drop on your page\u003c/p\u003e\u003cp\u003e🚀 FREE vs PRO\u003c/p\u003e\u003cp\u003e• Free — 5 presets, full color customization, locked KDX footer\u003c/p\u003e\u003cp\u003e• Pro ($29 lifetime) — unlocks Custom preset, custom formulas, unlimited inputs, output formatting (decimals + thousands separator), and editable footer (write your own or hide it)\u003c/p\u003e\u003cp\u003e🎯 WHO IT'S FOR\u003c/p\u003e\u003cp\u003e• Agencies building lead-gen landing pages with mortgage/ROI/pricing calculators\u003c/p\u003e\u003cp\u003e• Fintech and finance Framer sites that need on-page math\u003c/p\u003e\u003cp\u003e• Health and fitness landing pages that need a BMI tool\u003c/p\u003e\u003cp\u003e• SaaS founders running pricing/quote calculators\u003c/p\u003e\u003cp\u003e• Anyone tired of embedding a clunky third-party calculator iframe\u003c/p\u003e\u003cp\u003e🛡 WHY THIS PLUGIN\u003c/p\u003e\u003cp\u003e• 100% client-side, zero backend\u003c/p\u003e\u003cp\u003e• No third-party services, no API keys\u003c/p\u003e\u003cp\u003e• Custom Pro formulas are sandbox-evaluated (no eval on visitor input)\u003c/p\u003e\u003cp\u003e• 30-day money-back guarantee\u003c/p\u003e\u003cp\u003e• Built by KDX Studios\u003c/p\u003e\u003cp\u003eQuestions? 📩 \u003ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"mailto:thekhushaldewra@gmail.com\"\u003ethekhushaldewra@gmail.com\u003c/a\u003e\u003c/p\u003e6b:T928,\u003cp\u003eLineKit adds LINE Liff to your Framer site in under 5 minutes.\u003c/p\u003e\u003cp\u003eClick \"Insert\" on any of the 11 components and LineKit drops a Code File into your project that's ready to drag onto the canvas. No backend, no LIFF SDK boilerplate, no monthly fees — just paste your LIFF ID and publish.\u003c/p\u003e\u003ch3\u003e⭐ Demo\u003c/h3\u003e\u003cp\u003e\u003ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://linekit.framer.website/\"\u003ehttps://linekit.framer.website/\u003c/a\u003e\u003c/p\u003e\u003ch3\u003e⭐ Remix\u003c/h3\u003e\u003cp\u003e\u003ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://framer.link/WNehGF9\"\u003ehttps://framer.link/WNehGF9\u003c/a\u003e\u003c/p\u003e\u003ch3\u003eWhat's included\u003c/h3\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003eLiffProvider — bootstraps LIFF once per page\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eLoginButton, LogoutButton — auto-hide based on state\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eUserProfile — avatar + display name from the LINE profile, with built-in shimmer skeleton\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eMemberGate — show content only to logged-in (or logged-out) visitors\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eLineShareButton — opens LINE's share target picker (inside the LINE app)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eLinePayLinkButton — deep-links to a LINE Pay merchant URL\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eOpenInLineApp — opens any URL through LIFF's in-app browser\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eLoginRedirect — invisible utility that navigates after auth state changes\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eErrorBanner — surfaces LIFF errors cleanly\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eLoginStatus — debug pill for development\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003eBuilt for the Asia market\u003c/h3\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003eAuto-translates UI between English, ไทย, and 日本語 — or override per instance\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eDesigned for Framer designers serving Thai, Japanese, and Taiwanese clients with active LINE OA channels\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWorks the way Framer designers expect\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eAll 11 components show up in the Insert panel after a single click in the LineKit sidebar\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eProperty controls for every visual prop (color, radius, padding, font, layout)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePre-fills the LIFF ID and default locale you set in the plugin settings\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eNeed a LIFF ID first? Open the in-plugin \"How to get a LIFF ID\" link for a 5-minute walkthrough.\u003c/p\u003e\u003ch3\u003e☕ Buy a Coffee for Trirong Phasukyued 🙏\u003c/h3\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://ko-fi.com/linekit\"\u003ehttps://ko-fi.com/linekit\u003c/a\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePromptPay 0855544590\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e67:[\"$\",\"section\",null,{\"className\":\"related-row-layout-module-scss-module__zpYm4G__root\",\"children\":[[\"$\",\"div\",null,{\"className\":\"related-row-layout-module-scss-module__zpYm4G__separator\",\"data-recommendation-separator\":true,\"aria-hidden\":\"true\"}],[\"$\",\"div\",null,{\"className\":\"related-row-layout-module-scss-module__zpYm4G__header\",\"children\":[\"$\",\"h2\",null,{\"className\":\"related-row-layout-module-scss-module__zpYm4G__title\",\"children\":\"Related Plugins\"}]}],[\"$\",\"div\",null,{\"className\":\"related-row-layout-module-scss-module__zpYm4G__grid\",\"children\":[\"$\",\"$L68\",null,{\"items\":[{\"id\":\"1117\",\"resolved\":true,\"title\":\"Subscription Payments\",\"body\":\"$69\",\"bodyJson\":null,\"introduction\":\"Recurring payments for Framer\",\"slug\":\"subscription-payments\",\"author\":{\"framerUserId\":\"9bdea070-ea37-40d2-9943-455415b514f5\",\"name\":\"Khushal Dewra (KDX Studios)\",\"slug\":\"khushal-dewra\",\"avatar\":\"https://y4pdgnepgswqffpt.public.blob.vercel-storage.com/creators/307637/avatar-NM7akQxU3JcJlme7gymEqznPAeT33L.jpg\",\"followed\":false,\"followsYou\":false},\"media\":[{\"type\":\"image\",\"url\":\"https://y4pdgnepgswqffpt.public.blob.vercel-storage.com/media/9bdea070-ea37-40d2-9943-455415b514f5/5mruigdh\"},{\"type\":\"image\",\"
