,\"slug\":\"appear-effects\"},{\"id\":9,\"name\":\"Overlays \u0026 Modals\",\"slug\":\"overlays-modals\"},{\"id\":13,\"name\":\"Slideshows/Tickers\",\"slug\":\"slideshows-tickers\"},{\"id\":17,\"name\":\"Sticky Scrolling\",\"slug\":\"sticky-scrolling\"},{\"id\":18,\"name\":\"Scroll Effects\",\"slug\":\"scroll-effects\"},{\"id\":21,\"name\":\"CMS\",\"slug\":\"cms\"},{\"id\":25,\"name\":\"Custom Cursors\",\"slug\":\"custom-cursors\"},{\"id\":37,\"name\":\"Code Components\",\"slug\":\"code-components\"},{\"id\":39,\"name\":\"Selection Styles\",\"slug\":\"selection-styles\"}]}}]}]}]]}]\n6e:T517,\u003cp\u003e\u003cstrong\u003eAbout\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eThis started as my personal portfolio \u003ca href=\"https://kynejang.com\" rel=\"noopener noreferrer nofollow\" target=\"_blank\"\u003ekynejang.com\u003c/a\u003e. After I shared it, enough people asked if they could use it as a template that I decided to clean it up and release it for free.\u003c/p\u003e\u003cp\u003eThe original site used a font that couldn\u0026#39;t be redistributed, so for this release I swapped it for \u003cstrong\u003eFraunces\u003c/strong\u003e, a free variable font. The editorial, minimal feel — big type paired with thin, subtle lines — stayed the same.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003ePages included\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003eHome — a short intro\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eProjects — selected work showcase\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eProject detail — CMS-driven, so you can swap in your own projects without touching layout\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eContact — contact info + contact form\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e404 — custom error page\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003eFeatures\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003eEditorial typography powered by the Fraunces variable font\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eMinimal layout built on large type and thin dividing lines\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCMS-connected projects, easy to add or edit\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eFully responsive (desktop/mobile)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eFree to use, commercial use allowed (license terms noted separately)\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eHappy building !\u003c/p\u003e6f:T879,\u003cp\u003e\u003cstrong\u003eFree Minimal Editorial Portfolio Template for Artists and Designers\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eA clean, editorial portfolio template built for photographers, visual artists and designers who want their work to speak for itself. Pure black and white design, generous whitespace and a distraction free layout keep the focus on your images, not the interface.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eCMS Powered Project Gallery\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eEvery project lives in a single CMS collection with Image, Project, Client and Year fields. Add, remove or reorder projects directly from the CMS, no need to touch the canvas. The gallery follows a fixed editorial rhythm, alternating full width landscape images, centered portrait images and a staggered two column pairing for visual variation.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eAbout and Contact Collections\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eA dedicated About collection holds your name, short bio, long bio and location, updating your introduction and footer from one place. A separate Contact collection stores your email and links to Instagram, Behance and more, only the platforms you fill in will show on the site.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eModern Typography, Maximum Contrast\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eTypography pairs a clean modern sans for headings with a readable body font, set entirely in pure black on a pure white background. No color, no gradients, no shadows, just contrast and space, letting your photography, illustration or design work carry the page.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eResponsive Across Every Device\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eFully responsive across desktop, tablet and mobile, with the staggered gallery layout collapsing to a clean single column stack on smaller screens.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eEasy to Edit, No Code Required\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eEvery text and image can be edited directly on the canvas with a double click, or managed in bulk through the CMS panel. No code, no plugins, just Framer.\u003c/p\u003e\u003cp\u003eBuilt for photographers, fine artists, illustrators, designers and any creative who wants a fast, minimal, editorial portfolio without starting from scratch.\u003c/p\u003e\u003cp\u003eNeed help with a custom website, landing page, or template customization? Reach out at \u003ca href=\"mailto:hello@damircosic.com\"\u003ehello@damircosic.com\u003c/a\u003e\u003c/p\u003e70:T4af,\u003cp\u003e\u003cstrong\u003eGeenie\u003c/strong\u003e is a clean, minimal, and super smooth Framer template for creatives, studios, and agencies. Built with fluid transitions, impressive interactions, and carefully crafted micro-animations.\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003eKey features\u003c/strong\u003e\u003c/h3\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eGenie Effect\u003c/strong\u003e — A smooth Genie-inspired effect on the Home project cards.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eMagnetic Cards\u003c/strong\u003e — Interactive Work cards that subtly respond to your cursor.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eSmooth Nav Transform\u003c/strong\u003e — A fluid navigation experience.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eHorizontal Scroll\u003c/strong\u003e — A smooth horizontal scrolling experience on Work Detail pages.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eMicro-animations\u003c/strong\u003e — Subtle interactions and motion details throughout the entire template.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eCMS\u003c/strong\u003e — Work Detail and Services are powered by Framer CMS.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003ePages:\u003c/strong\u003e Home, Work, Services, About, Work Detail.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eRefund Policy:\u003c/strong\u003e Due to the digital nature of this product, all purchases are non-refundable.\u003c/p\u003e\u003cp\u003eQuestions? Contact \u003ca href=\"mailto:hey.jeanstak@gmail.com\"\u003e\u003cstrong\u003ehey.jeanstak@gmail.com\u003c/strong\u003e\u003c/a\u003e.\u003c/p\u003e69:[\"$\",\"section\",null,{\"className\":\"related-row-layout-module-scss-module__zpYm4G__root\",\"children\":[[\"$\",\"div\",null,{\"className\":\"related-row-layout-module-scss-module__zpYm4G__separator\",\"data-recommendation-separator\":true,\"aria-hidden\":\"true\"}],[\"$\",\"div\",null,{\"className\":\"related-row-layout-module-scss-module__zpYm4G__header\",\"children\":[\"$\",\"h2\",null,{\"className\":\"related-row-layout-module-scss-module__zpYm4G__title\",\"children\":\"Related Templates\"}]}],[\"$\",\"div\",null,{\"className\":\"related-row-layout-module-scss-module__zpYm4G__grid\",\"children\":[\"$\",\"$L6a\",null,{\"items\":[{\"id\":\"70827\",\"resolved\":true,\"title\":\"Kyne\",\"body\":\"$6e\",\"bodyJson\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"About\",\"marks\":[{\"type\":\"bold\"}]}]},{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"This started as my personal portfolio \"},{\"type\":\"text\",\"text\":\"kynejang.com\"
