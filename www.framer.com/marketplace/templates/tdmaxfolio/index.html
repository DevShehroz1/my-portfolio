ong\u003e\u003c/a\u003e\u003c/p\u003e\u003cp\u003e\u003ca href=\"https://volt.supply/templates/senri\" rel=\"noopener noreferrer nofollow\" target=\"_blank\"\u003e\u003cstrong\u003eTemplate Details\u003c/strong\u003e\u003c/a\u003e\u003c/p\u003e\u003ch2\u003eDark tech Framer portfolio template\u003c/h2\u003e\u003cp\u003eSENRI is a sophisticated Framer portfolio template built for designers and creatives who want to elevate their presence. It combines a black and white visual language with a tech-forward feel and an editorial layout, creating a confident and modern aesthetic.\u003c/p\u003e\u003cp\u003eDesigned to feel refined yet expressive, SENRI balances structure and experimentation. It’s easy to customize, flexible enough to adapt to different creative fields, and built to scale as your work grows.\u003c/p\u003e\u003cp\u003eSENRI comes with everything you need to launch a professional portfolio website:\u003c/p\u003e\u003ch3\u003ewhat’s included\u003c/h3\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003eCustom code components\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eFully customizable layout and styles\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCMS-powered projects and case studies\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eDedicated case study layout\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eGlobal text and color styles\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eReusable components system\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eMobile-optimized and fully responsive\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eSmooth, eye-catching animations and transitions\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eScalable structure built for long-term use\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003eA great fit for:\u003c/h3\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003eDesigners and design studios\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePhotographers and visual creatives\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eDevelopers and technical creatives\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePeople working in tech-focused fields\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eAI, Web3, and future-facing creatives\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eSENRI is built to showcase your work with clarity and confidence, without getting in the way. It’s a strong foundation for creatives who care about craft, presentation, and modern aesthetics.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eIf you have any questions or feedback, feel free to message me at \u003c/strong\u003e\u003ca href=\"mailto:hello@tomdavidov.com\"\u003e\u003cstrong\u003ehello@volt.supply\u003c/strong\u003e\u003c/a\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eVisit \u003c/strong\u003e\u003ca href=\"https://volt.supply/\" rel=\"noopener noreferrer nofollow\" target=\"_blank\"\u003e\u003cstrong\u003eVolt Supply\u003c/strong\u003e\u003c/a\u003e\u003cstrong\u003e for more templates and resources.\u003c/strong\u003e\u003c/p\u003e6c:T8a4,\u003cp\u003e\u003ca href=\"https://td-auniron.framer.website/\" rel=\"noopener noreferrer nofollow\" target=\"_blank\"\u003ePreview Template\u003c/a\u003e\u003c/p\u003e\u003cp\u003e\u003ca href=\"https://volt.supply/templates/auniron\" rel=\"noopener noreferrer nofollow\" target=\"_blank\"\u003eMore Details\u003c/a\u003e\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003ch2\u003eWhere a strict grid meets fluid interaction\u003c/h2\u003e\u003cp\u003eAuniron is a bold Framer portfolio template for creative directors, designers, and independent studios who want their work to feel structured without feeling safe. A sharp editorial grid keeps everything clear, while liquid-glass navigation, tactile motion, and playful interactive details bring it to life.\u003c/p\u003e\u003cp\u003eOversized typography, a reactive particle wordmark, and confident color give the site real presence—without competing with the work.\u003c/p\u003e\u003ch3\u003eWho it’s for\u003c/h3\u003e\u003cp\u003eCreative directors, brand designers, art directors, multidisciplinary creatives, and small studios looking for a portfolio with a strong point of view.\u003c/p\u003e\u003ch3\u003eEditorial Grid, Fluid Details\u003c/h3\u003e\u003cp\u003eThe layout is precise and deliberate, but never rigid. Structured typography and modular project blocks meet glass-inspired surfaces, a custom cursor, and smooth interaction to create a contrast that feels fresh, expressive, and current.\u003c/p\u003e\u003ch3\u003eA Portfolio That Knows How to Pace the Work\u003c/h3\u003e\u003cp\u003eAuniron moves from a bold introduction into featured work, a clear project index, services, an about section, and contact. The rhythm feels curated rather than crowded—more exhibition than image wall.\u003c/p\u003e\u003ch3\u003eInteractive Wordmark \u0026amp; Motion\u003c/h3\u003e\u003cp\u003eA reactive particle wordmark, custom cursor, smooth scrolling, and carefully timed interactions add energy in the right places. Playful when they should be, restrained when the work needs space.\u003c/p\u003e\u003ch3\u003eCMS-Powered Project Stories\u003c/h3\u003e\u003cp\u003eManage featured work and case studies through the Framer CMS. Project pages support images and video, full-width galleries, square image grids, project details, deliverables, team credits, calls to action, and previous/next navigation.\u003c/p\u003e\u003ch3\u003eEasy to Make Your Own\u003c/h3\u003e\u003cp\u003eSwap the content, imagery, typography, and colors directly in Framer. Reusable components and clearly organized sections keep everything consistent as the portfolio grows.\u003c/p\u003e6d:T6a2,\u003cp\u003e\u003ca href=\"https://td-tarafolio.framer.website/\" rel=\"noopener noreferrer nofollow\" target=\"_blank\"\u003e\u003cstrong\u003eLive Preview\u003c/strong\u003e\u003c/a\u003e\u003c/p\u003e\u003cp\u003e\u003ca href=\"https://volt.supply/templates/tarafolio\" rel=\"noopener noreferrer nofollow\" target=\"_blank\"\u003e\u003cstrong\u003eTemplate Details\u003c/strong\u003e\u003c/a\u003e\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003ch2\u003ePortfolio for Designers\u003c/h2\u003e\u003cp\u003eA dashboard-style portfolio template for designers, product managers, programmers, and more. Great for those working across UX, product, SaaS, and everything tech. It features side navigation, highly detailed case study and blog pages. It’s more than just a portfolio — it’s your digital home, built to reflect your personality, ambition, and craft. This portfolio will help you on your journey, whether you’re just starting out or already a senior professional.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eKey features:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003eSubtle and smooth interactions\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eExtremely detailed project pages, perfect for product designers\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBlog section with intuitive navigation\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eLight and dark mode options\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eTestimonials and resume sections\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e...and much more\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eSet up your portfolio effortlessly and start attracting leads today!\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eVisit \u003c/strong\u003e\u003ca href=\"https://volt.supply/\" rel=\"noopener noreferrer nofollow\" target=\"_blank\"\u003e\u003cstrong\u003eVolt Supply\u003c/strong\u003e\u003c/a\u003e\u003cstrong\u003e for more templates and resources, or contact me at \u003c/strong\u003e\u003ca href=\"mailto:hello@volt.supply\"\u003e\u003cstrong\u003ehello@volt.supply\u003c/strong\u003e\u003c/a\u003e\u003cstrong\u003e if you have any questions or feedback.\u003c/strong\u003e\u003c/p\u ,\"content\":[{\"type\":\"text\",\"text\":\"Easy to Make Your Own\"}],\"attrs\":{\"level\":2}},{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"Swap the content, imagery, typography, and colors directly in Framer. Reusable components and clearly organized sections keep everything consistent as the portfolio grows.\"}]}]},\"introduction\":\"Bold Portfolio Framer Template\",\"slug\":\"td-auniron\",\"author\":{\"framerUserId\":\"433f7274-9cd4-4196-92b1-30ec7f66bbf6\",\"name\":\"Tom D\",\"slug\":\"tom-d\",\"avatar\":\"https://y4pdgnepgswqffpt.public.blob.vercel-storage.com/creators/29089/avatar-bg7PNBgYFZF8iFMvSGSxiqu7vDXhw2.jpg\",\"followed\":false,\"followsYou\":false},\"media\":[{\"type\":\"image\",\"url\":\"https://y4pdgnepgswqffpt.public.blob.vercel-storage.com/media/433f7274-9cd4-4196-92b1-30ec7f66bbf6/01a00033-1951-71da-8add-bf2d213496c4.jpg\"},{\"type\":\"image\",\"url\":\"https://y4pdgnepgswqffpt.public.blob.vercel-storage.com/media/433f7274-9cd4-4196-92b1-30ec7f66bbf6/01a00980-599d-703e-89bf-51bc7d714855.jpg\"}],\"post\":{\"id\":\"01a000ac-34b9-7188-bf34-1dec10240db2\",\"bodyJson\":{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"Auniron is live, and it’s wild. No limits on this one.\"}]},{\"type\":\"paragraph\",\"content\":[{\"type\":\"text\",\"text\":\"Just imagination.\"}]}]},\"likes\":{\"count\":28,\"liked\":false},\"comments\":{\"count\":0},\"reposts\":{\"count\":0,\"reposted\":false,\"repostId\":null}},\"createdAt\":\"2026-08-14T14:28:00.308Z\",\"updatedAt\":\"2026-08-16T07:36:46.003Z\",\"publishedAt\":\"2026-08-14T14:28:00.304Z\",\"featuredAt\":null,\"approvedAt\":null,\"type\":\"template\",\"attributes\":{\"price\":null,\"paymentUrl\":\"https://framer.link/rVWmw2Q\",\"remixUrl\":\"https://framer.link/rVWmw2Q\",\"previewUrl\":\"https://td-auniron.framer.website/\",\"categories\":[{\"id\":16,\"name\":\"Personal\",\"slug\":\"personal\"},{\"id\":17,\"name\":\"Photography\",\"slug\":\"photog ts effortlessly.\u003c/p\u003e\u003ch3\u003ePerfect for\u003c/h3\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003eLeadership speakers and keynote presenters\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eMotivational and public speakers\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBusiness coaches and consultants\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePersonal brands and thought leaders\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCorporate trainers and workshop leaders\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eEntrepreneurs building authority online\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e6f:T8e2,\u003cp\u003e\u003ca href=\"https://aicreator.framer.website/\" rel=\"noopener noreferrer nofollow\" target=\"_blank\"\u003e\u003cstrong\u003eLive Preview\u003c/strong\u003e\u003c/a\u003e\u003c/p\u003e\u003ch2\u003eShowcase your portfolio with clarity and confidence.\u003c/h2\u003e\u003cp\u003eAllam is a modern, professional Framer template crafted for AI creators who produce content for brands and clients. Its clean, structured design helps you present your services with trust, authority, and a polished creative edge.\u003c/p\u003e\u003cp\u003eWith flexible layouts and a consistent visual system, Allam adapts effortlessly to different audiences while ensuring your expertise remains front and center.\u003c/p\u003e\u003ch3\u003eWhat makes Allam special\u003c/h3\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003eA modern, professional, and visually striking design built specifically for AI content creators.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eFlexible layouts that let you highlight your expertise, process, and portfolio.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eClear navigation and well-structured pages that emphasize your knowledge and credibility.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003eEverything your business needs — already included\u003c/h3\u003e\u003cul\u003e\u003cli\
